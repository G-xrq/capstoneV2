<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Blockchain-Based Donation & Relief Transparency System (BBDRTS). Transparent disaster relief allocation verified on the Ethereum Sepolia EVM testnet." />
    <title>BBDRTS — Blockchain-Based Donation & Relief Transparency System</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('bbdrts_theme');
          var theme = (saved === 'dark' || saved === 'light') ? saved : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }

        // Fast icon font loading guard: prevents raw ligature text flash (e.g. location_on, apartment)
        if ('fonts' in document) {
          document.fonts.load('24px "Material Symbols Outlined"').then(function() {
            document.documentElement.classList.add('bbdrts-icons-ready');
          }).catch(function() {
            document.documentElement.classList.add('bbdrts-icons-ready');
          });
        } else {
          document.documentElement.classList.add('bbdrts-icons-ready');
        }
      })();
    </script>
    <!-- Preload local Material Symbols font for instantaneous 0ms icon rendering locally and on Vercel -->
    <link rel="preload" href="/fonts/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
